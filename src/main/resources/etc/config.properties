# SQLite Properties
#
# SQLite database file path (default: mavendb.db in current directory)
org.mavendb.sqlite.url=jdbc:sqlite:mavendb.db
# Batch size for SQLite writes (default: 20000)
# For 80-200 million records, this batch size provides good balance between memory usage and performance
# org.mavendb.sqlite.batch.size=100000

#
# Maximum number of concurrent virtual threads
#
# - Default number is available processors
#org.mavendb.thread.pool.size=4

#
# SQL Store Queue Properties
#   The store queue will occupy memory proportional to the queue size.
#   Adjust these settings based on available system memory.
#   For example, a queue size of 256 and batch size of 20000 may use around 15 GB of memory.
#   When increasing the queue size, lower down the queue size to ensure sufficient memory is available to avoid OutOfMemory errors.
#
#   Batch Size | Max Queue Size | Approx. Memory Usage
#     20,000   |            256 |  ~15 GB
#     20,000   |            128 |   ~8 GB
#     50,000   |             16 |  ~18 GB
#    100,000   |             64 |  ~35 GB
#    200,000   |             16 |  ~29 GB
#
# Maximum queue size for SQL store tasks before throttling (default: 64)
#org.mavendb.sql.queue.max.size=16
# Queue size threshold to resume submissions (default: 32)
#org.mavendb.sql.queue.resume.size=8
