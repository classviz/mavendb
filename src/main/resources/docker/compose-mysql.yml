networks:
  mavendbmysqlnet:
    driver: bridge

# Inline init scripts, executed by the MySQL image as root on first database initialization
configs:
  mavendb-mysql-init:
    content: |
      -- Allow the app user to run: ALTER INSTANCE [DISABLE|ENABLE] INNODB REDO_LOG to speed up mass data loading
      GRANT INNODB_REDO_LOG_ENABLE ON *.* TO 'mavendbadmin'@'%';

services:

  # Mavendb Database
  mavendb-mysql:
    image: mysql:9
    pull_policy: always
    # Buffer Pool Settings based on OS RAM Size
    #   OS RAM :  innodb_buffer_pool_size
    #    64 GB                        40G
    #   128 GB                        80G
    #
    # innodb_flush_log_at_trx_commit:
    #   For batch operations where absolute ACID compliance for every single intermediate write is not critical, setting this to 0 or 2 can improve write performance, though at the risk of losing a few seconds of data in a crash.
    # max_allowed_packet:
    #   Set max_allowed_packet = 1G, This is the safest and most future‑proof value. MySQL supports up to 1GB for this variable.
    command:
      --bulk_insert_buffer_size=128M
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_bin
      --default-time-zone='+00:00'
      --disable-log-bin
      --group_concat_max_len=52428800
      --innodb_adaptive_hash_index=OFF
      --innodb_buffer_pool_size=80G
      --innodb_ddl_buffer_size=1G
      --innodb_ddl_threads=16
      --innodb_doublewrite=0
      --innodb_file_per_table=1
      --innodb_flush_log_at_timeout=4
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
      --innodb_log_buffer_size=256M
      --innodb_read_io_threads=16
      --innodb_redo_log_capacity=16G
      --innodb_sort_buffer_size=512M
      --innodb_write_io_threads=16
      --local_infile=1
      --log_queries_not_using_indexes=1
      --long_query_time=2
      --max_allowed_packet=1G
      --max_connections=32
      --max_heap_table_size=5G
      --read_rnd_buffer_size=512M
      --slow_query_log=1
      --skip-name-resolve
      --sort_buffer_size=512M
      --tmp_table_size=5G
      --temptable_max_ram=5G
    hostname: mavendb-mysql
    container_name: mavendb-mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'mavendb'
      MYSQL_USER: 'mavendbadmin'
      # Passwords are subjected to be changed based on your requirement
      MYSQL_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    deploy:
      resources:
        reservations:
          memory: 10240M
    expose:
      # Opens port 3306 on the container inside the docker network
      - '3306'
    ports:
      # Map docker MySQL port to hosting machine
      - ${MYSQL_PORT}:3306
    configs:
      - source: mavendb-mysql-init
        target: /docker-entrypoint-initdb.d/01-grant.sql
    networks:
      - mavendbmysqlnet
 
  # Database Admin Tool
  mavendb-mysql-adminer:
    image: adminer
    pull_policy: always
    hostname: mavendb-mysql-adminer
    container_name: mavendb-mysql-adminer
    restart: always
    environment:
      # Hostname of the DB Image
      ADMINER_DEFAULT_SERVER: 'mavendb-mysql'
    depends_on:
      - mavendb-mysql
    ports:
      - ${MYSQL_ADMINER_PORT}:8080
    networks:
      - mavendbmysqlnet

  # Rest API
  mavendb-mysql-api:
    image: mevdschee/php-crud-api
    pull_policy: always
    hostname: mavendb-mysql-api
    container_name: mavendb-mysql-api
    environment:
      PHP_CRUD_API_DRIVER: 'mysql'
      PHP_CRUD_API_ADDRESS: 'mavendb-mysql'
      PHP_CRUD_API_PORT: 3306
      PHP_CRUD_API_DATABASE: 'mavendb'
      PHP_CRUD_API_TABLES: 'gav'
      PHP_CRUD_API_USERNAME: 'mavendbadmin'
      PHP_CRUD_API_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      PHP_CRUD_API_DEBUG: 1
    depends_on:
      - mavendb-mysql
    ports:
      - "2080:80"
    networks:
      - mavendbmysqlnet
