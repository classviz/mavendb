# SQLite database file path (default: mavendb.sqlite in current directory)
org.mavendb.sqlite.url=jdbc:sqlite:mavendb.sqlite
# Batch size for SQLite writes (default: 20000)
# For 80-200 million records, this batch size provides good balance between memory usage and performance
# org.mavendb.sqlite.batch.size=100000

#
# Maximum number of batches written to the database at the same time (virtual threads)
#
# - Default number is 4, valid range 2-64; SQLite always uses 1
# - Memory: at most (thread pool size + 2) batches are held in memory:
#   the ones being written, one ready to write, and one being filled
#org.mavendb.thread.pool.size=4
